<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Thanks for visiting. Keeping prod always on.">
<title>Thanks for visiting</title>
<defs>
  <linearGradient id="t" gradientUnits="userSpaceOnUse" x1="300" x2="900" spreadMethod="reflect"><stop offset="0" stop-color="#00e5ff"/><stop offset=".5" stop-color="#ff2bd6"/><stop offset="1" stop-color="#7c4dff"/>
