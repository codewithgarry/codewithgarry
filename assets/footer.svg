<text x="600" y="62" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="3" fill="url(#t)">THANKS FOR VISITING</text>
<text x="600" y="94" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, 'Liberation Mono', monospace" font-size="15" fill="#b9bee8">$ kubectl get status --namespace=prod  →  always-on</text>
