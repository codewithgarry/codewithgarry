name: Metrics
on:
  # Schedule DAILY auto-updates at 12:00 PM IST (6:30 AM UTC)
  schedule:
    - cron: "30 6 * * *"
  # Manual trigger
  workflow_dispatch:
  # Auto-trigger on any push to main (immediate updates)
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics (Daily Auto-Update + Lifetime Data)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: codewithgarry
          template: classic
          base: header, activity, community, repositories
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata
          config_output: svg
          
          # === 3D ISOMETRIC CALENDAR (Like your image) ===
          
          # 📅 3D ISOMETRIC Calendar - Beautiful 3D cube visualization
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_isocalendar_format: default
          
          # 🔥 COMMITS STREAKS (Like your image)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          
          # 🈷️ All-time languages analysis
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          
          # 🎖️ All achievements (lifetime)
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          
          # 📊 COMMIT STATISTICS (Like your image - "Commits per day", "Best streak")
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 365
          plugin_activity_filter: all
          plugin_activity_visibility: all
          
          # 📈 COMMIT STREAKS & STATS
          plugin_calendar: yes
          plugin_calendar_limit: 0
          
          # 🏆 Notable contributions
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes