name: Metrics
on:
  # Schedule DAILY auto-updates at 12:00 PM IST (6:30 AM UTC)
  schedule:
    - cron: "30 6 * * *"
  # Manual trigger
  workflow_dispatch:
  # Auto-trigger on any push to main (immediate updates)
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics (- Chandra Style)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: codewithgarry
          template: classic
          base: header, activity, community, repositories, metadata
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata
          config_output: svg
          
          # === - CHANDRA STYLE METRICS ===
          
          # 📅 3D Isometric contributions calendar (like -'s)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_isocalendar_format: default
          
          # 🈷️ Languages with detailed stats (like -'s)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          
          # 🎖️ All achievements (like -'s)
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          
          # 📊 Community activity (issues, PRs like -'s)
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 365
          plugin_activity_filter: all
          plugin_activity_visibility: all
          
          # 🏆 Notable contributions (like -'s)
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes
          
          # ⭐ Stargazers tracking (like -'s)
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: classic
          
          # 👥 Followers display (like -'s) 
          plugin_followers: yes
          plugin_followers_identicons: yes
          
          # 📈 Detailed activity timeline
          plugin_calendar: yes
          plugin_calendar_limit: 0