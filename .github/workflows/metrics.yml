name: Metrics
on:
  # Schedule daily updates at 12:00 PM IST (6:30 AM UTC)
  schedule:
    - cron: "30 6 * * *"
  # Manual trigger only (remove auto-push trigger for speed)
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics (Optimized)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: codewithgarry
          template: classic
          base: header, activity, community, repositories
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata
          config_output: svg
          optimize: svg
          
          # === OPTIMIZED - Essential Only ===
          
          # 📅 Simple calendar (faster)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # 🈷️ Top languages only (much faster)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 10
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_threshold: 2%
          
          # 🎖️ Basic achievements only
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          
          # 📈 Activity
          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_limit: 5
          plugin_activity_load: 300
          plugin_activity_visibility: all